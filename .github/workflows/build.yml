name: Build APK

# Builds the debug APK in the cloud so you don't need Android Studio or the SDK locally.
# Runs automatically on every push to main, and can also be started manually from the
# Actions tab (Run workflow). When it finishes, download the APK from the run's
# "Artifacts" section and install it on your phone.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The Gradle wrapper jar is not committed, so we provide Gradle directly
      # instead of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
